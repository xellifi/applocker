<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AppLocker SaaS - Premium Parent Control Dashboard.">
  <meta name="theme-color" content="#6366F1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppLocker SaaS">

  <!-- Open Graph -->
  <meta property="og:title" content="AppLocker SaaS - Parent Control">
  <meta property="og:description" content="Premium Parental Control & Device Management">
  <meta property="og:type" content="website">

  <title>AppLocker SaaS - Parent Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F172A;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F9FAFB;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: #6366F1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 16px 32px rgba(99,102,241,0.25);
      animation: pulse 2s infinite;
    }
    .logo svg { width: 40px; height: 40px; fill: white; }
    .app-name {
      color: white;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .app-sub {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 40px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99,102,241,0.1);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(108,63,197,0.5); }
      50% { box-shadow: 0 0 60px rgba(108,63,197,0.8); }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
    </div>
    <div class="app-name">AppLocker</div>
    <div class="app-sub">Parent Control Dashboard</div>
    <div class="spinner"></div>
  </div>

  <script>
    function hideLoading() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 400);
      }
    }

    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', hideLoading);

    // Fallback: hide after 5 seconds no matter what
    setTimeout(hideLoading, 5000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
