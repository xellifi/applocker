<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AppLocker SaaS - Premium Parent Control Dashboard.">
  <meta name="theme-color" content="#6366F1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA / iOS / Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppLocker Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Open Graph -->
  <meta property="og:title" content="AppLocker Admin">
  <meta property="og:description" content="Premium Parental Control & Device Management">
  <meta property="og:type" content="website">

  <title>AppLocker Admin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Preload critical Flutter resources for faster boot -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  PWA INSTALL — captured IMMEDIATELY, before Flutter loads ║
    ║  beforeinstallprompt fires at page-load time; we must    ║
    ║  intercept it here in raw JS and stash it in a global.   ║
    ║  Flutter's Dart code reads window._pwaPrompt later.      ║
    ╚══════════════════════════════════════════════════════════╝
  -->
  <script>
    (function () {
      window._pwaPrompt = null;
      window._pwaPromptCallback = null;
      window._pwaInstallLastState = 'initializing';

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true;
      }

      function isEmbedded() {
        try {
          return window.self !== window.top;
        } catch (e) {
          return true;
        }
      }

      function directInstallUrl() {
        if (window.location.pathname.indexOf('/__replco/') === 0) {
          return window.location.origin + '/';
        }
        return window.location.origin + window.location.pathname + window.location.search;
      }

      if (isStandalone()) {
        window._pwaInstalled = true;
        localStorage.setItem('pwa_installed', 'true');
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window._pwaPrompt = e;
        window._pwaInstallLastState = 'ready';
        if (typeof window._pwaPromptCallback === 'function') {
          window._pwaPromptCallback();
        }
      });

      window.addEventListener('appinstalled', function () {
        window._pwaInstalled = true;
        window._pwaPrompt = null;
        localStorage.setItem('pwa_installed', 'true');
        if (typeof window._pwaInstalledCallback === 'function') {
          window._pwaInstalledCallback();
        }
      });

      // Called by Dart on install button tap.
      // Runs entirely in JS so the Promise chain works reliably.
      window.triggerPwaInstall = function () {
        if (!window._pwaPrompt) return 'no_prompt:' + window.getPwaInstallReason();
        var p = window._pwaPrompt;
        window._pwaPrompt = null;           // consume it
        p.prompt();
        p.userChoice.then(function (result) {
          if (result.outcome === 'accepted') {
            localStorage.setItem('pwa_installed', 'true');
            window._pwaInstalled = true;
            if (typeof window._pwaInstalledCallback === 'function') {
              window._pwaInstalledCallback();
            }
          } else {
            // User dismissed — restore so they can try again
            window._pwaPrompt = p;
            window._pwaInstallLastState = 'dismissed';
          }
        });
        return 'prompted';
      };

      window.hasPwaPrompt = function () {
        return window._pwaPrompt !== null;
      };

      window.getPwaInstallReason = function () {
        if (isStandalone() || window._pwaInstalled === true) return 'installed';
        if (window._pwaPrompt) return 'ready';
        if (isEmbedded()) return 'embedded_preview';
        if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          return 'insecure_context';
        }
        if (!('serviceWorker' in navigator)) return 'service_worker_unavailable';
        return window._pwaInstallLastState || 'waiting_for_browser';
      };

      window.getPwaInstallDebug = function () {
        return JSON.stringify({
          reason: window.getPwaInstallReason(),
          hasPrompt: window._pwaPrompt !== null,
          embedded: isEmbedded(),
          standalone: isStandalone(),
          secureContext: window.isSecureContext,
          serviceWorkerSupported: 'serviceWorker' in navigator,
          serviceWorkerControlled: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
          manifestHref: document.querySelector('link[rel="manifest"]') ? document.querySelector('link[rel="manifest"]').href : '',
          directInstallUrl: directInstallUrl(),
          userAgent: navigator.userAgent
        });
      };

      window.openPwaInstallTarget = function () {
        var url = directInstallUrl();
        window.open(url, '_blank', 'noopener,noreferrer');
        return url;
      };

      // Disable pull-to-refresh on Chrome Android
      var _touchStartY = 0;
      document.addEventListener('touchstart', function (e) {
        _touchStartY = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        var y = e.touches[0].clientY;
        // Block downward swipe at the top of the page
        if (y > _touchStartY && window.scrollY === 0) {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #060D1F;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      /* Disable pull-to-refresh and overscroll bounce */
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      touch-action: pan-x pan-y;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #060D1F 0%, #0F1A35 50%, #1a1050 100%);
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading::before, #loading::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    #loading::before {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      top: -100px; right: -80px;
    }
    #loading::after {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%);
      bottom: -60px; left: -60px;
    }
    .logo-wrap { position: relative; margin-bottom: 28px; }
    .logo-ring {
      position: absolute; inset: -14px; border-radius: 50%;
      border: 1.5px solid rgba(99,102,241,0.25);
      animation: ring-pulse 2s ease-in-out infinite;
    }
    .logo-ring-2 {
      inset: -24px; border-color: rgba(99,102,241,0.12); animation-delay: 0.3s;
    }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 22px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(99,102,241,0.45), 0 16px 32px rgba(0,0,0,0.3);
      animation: pulse 2.5s ease-in-out infinite; position: relative; z-index: 1;
    }
    .logo svg { width: 42px; height: 42px; fill: white; }
    .app-name { font-size: 30px; font-weight: 900; letter-spacing: -1px; margin-bottom: 6px; }
    .app-name span:first-child { color: #ffffff; }
    .app-name span:last-child  { color: #6366F1; }
    .app-sub {
      color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 700;
      letter-spacing: 3.5px; text-transform: uppercase; margin-bottom: 48px;
    }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(99,102,241,0.15); border-top-color: #6366F1;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    .loading-text { color: rgba(255,255,255,0.25); font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(99,102,241,0.45), 0 16px 32px rgba(0,0,0,0.3); }
      50%       { box-shadow: 0 0 64px rgba(99,102,241,0.7),  0 16px 32px rgba(0,0,0,0.3); }
    }
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.08); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Loading screen (pure HTML — shows immediately, no JS needed) -->
  <div id="loading">
    <div class="logo-wrap">
      <div class="logo-ring logo-ring-2"></div>
      <div class="logo-ring"></div>
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
    </div>
    <div class="app-name"><span>App</span><span>Locker</span></div>
    <div class="app-sub">Parental Control</div>
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="loading-text">Loading dashboard...</div>
    </div>
  </div>

  <script>
    (function () {
      function hideLoading() {
        var el = document.getElementById('loading');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }
      }
      // If the user was previously logged in, skip the splash entirely
      if (localStorage.getItem('applocker_logged_in') === 'true') {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }
      // Flutter fires this event on its very first rendered frame
      window.addEventListener('flutter-first-frame', hideLoading);
      // Hard fallback — never block the user longer than 8 seconds
      setTimeout(hideLoading, 8000);
    })();
  </script>

  <!-- Load Flutter immediately (not async/defer so it starts as soon as parsed) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
