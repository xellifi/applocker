name: parental_control
description: Parental Control App - Child APK + Parent PWA Dashboard
publish_to: "none"
version: 2.0.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.3

  # Location & Device
  geolocator: ^13.0.1
  battery_plus: ^6.0.1
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  flutter_device_apps: ^0.6.0
  intl: ^0.19.0

  # Lock / Overlay (Android)
  # flutter_lock_task: Use MethodChannel fallback (no pub package available)
  # screen_lock_plugin: handled via MethodChannel

  # Background
  workmanager: ^0.9.0

  # UI & SaaS Redesign
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.68.0
  heroicons: ^0.9.0
  provider: ^6.1.2
  dropdown_search: ^6.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  
  # New features support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  package_info_plus: ^8.0.2
  app_settings: ^5.1.1
  
  # Modern UI components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  open_file: ^3.3.0
  url_launcher: 6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

